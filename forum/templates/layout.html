<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link
		rel="stylesheet"
		type="text/css"
		href="{{ url_for('static', filename='bootstrap.min.css') }}"
	>

	<link
		rel="stylesheet"
		type="text/css"
		href="{{ url_for('static', filename='style.css') }}"
	>

	<title>DishCourse</title>
</head>

<body>

	<div class="dc-app-shell">

		<!-- =====================================
		     GLOBAL HEADER
		     ===================================== -->

		<header class="dc-top-header">
			{% include 'header.html' %}
		</header>


		<!-- =====================================
		     APPLICATION BODY
		     ===================================== -->

		<div class="dc-body-layout">

			<!-- Left Navigation -->
			<aside class="dc-left-sidebar">
				{% include 'sidebar.html' %}
			</aside>


			<!-- Main Content -->
			<main class="dc-main-content">

				{% if errors %}

					<div class="dc-errors">

						{% for error in errors %}

							<div class="alert alert-danger">
								{{ error }}
							</div>

						{% endfor %}

					</div>

				{% endif %}


				{% block body %}
				{% endblock %}

			</main>


			<!-- Right Sidebar -->
			<aside class="dc-right-sidebar">
				{% include 'right_sidebar.html' %}
			</aside>

		</div>


		<!-- =====================================
		     FOOTER
		     ===================================== -->

		<footer class="dc-footer">

			<div class="dc-footer-inner">

				<div>
					&copy; 2026 DishCourse
				</div>

				<div class="dc-footer-links">

					<a href="#">About</a>
					<a href="#">Guidelines</a>
					<a href="#">Privacy Policy</a>
					<a href="#">Contact</a>

				</div>

				<div class="dc-social-links">
					<span>◎</span>
					<span>f</span>
					<span>p</span>
					<span>𝕏</span>
				</div>

			</div>

		</footer>

	</div>

</body>

</html>
