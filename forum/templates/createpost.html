{% extends 'layout.html' %}

{% block body %}
<div class="create-post-page">
	<section class="create-post-header">
		<p class="section-eyebrow">New Discussion</p>
		<h1>Start a Conversation</h1>
		<p>You're posting in <strong>{{ subforum.title }}</strong></p>
	</section>


	<section class="create-post-card">
		<form action="action_post?sub={{ subforum.id }}" method="POST" class="create-post-form">

			<div class="create-post-field">
				<label for="post-title">Discussion Title</label>
				<input id="post-title" type="text" name="title" class="form-control"
					placeholder="Give your discussion a title...">
			</div>

			<div class="create-post-field"><!-- added checkbox in its on create post field, mcc -->
				<input type="checkbox" name="is_public" id="is_public" checked>
				<label for="is_public">Make this post public</label>
			</div>

			<div class="create-post-field">
				<label for="post-content">What would you like to share?</label>
				<textarea id="post-content" name="content"
					class="form-control create-post-textarea" rows="12"
					placeholder="Share your recipe, idea, question, or food thought..."></textarea>
			</div>

			<div class="create-post-helper">
				<span>💡</span>
				<p>Tip: Give people enough detail to jump into the conversation.</p>
			</div>

			<div class="create-post-actions">
				<a href="/subforum?sub={{ subforum.id }}" class="create-post-cancel">Cancel</a>
				<input type="submit" value="Post Discussion" class="btn dishcourse-primary-btn">
			</div>

		</form>
	</section>
</div>
{% endblock %}
