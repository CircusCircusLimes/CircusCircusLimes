{% extends 'layout.html' %}

{% block body %}

<section class="create-post-page">

    <div class="create-post-heading">
        <span class="create-post-eyebrow">START A CONVERSATION</span>
        <h1>Create a Discussion</h1>
        <p>You're posting in <strong>{{ subforum.name }}</strong></p>
    </div>

    <section class="create-post-card">

        <form action="action_post?sub={{ subforum.id }}" method="POST" class="create-post-form">

            <div class="create-post-field">
                <label for="post-title">Discussion Title</label>
                <input
                    id="post-title"
                    type="text"
                    name="title"
                    class="form-control"
                    placeholder="Give your discussion a title..."
                >
            </div>

            <div class="create-post-public">
                <label class="public-toggle" for="is_public">
                    <input
                        type="checkbox"
                        name="is_public"
                        id="is_public"
                        checked
                    >
                    <span class="public-toggle-slider"></span>

                    <span class="public-toggle-text">
                        <strong>Make this post public</strong>
                        <small>Public posts can be viewed by everyone.</small>
                    </span>
                </label>
            </div>

            <div class="create-post-public">
                <label class="public-toggle" for="content_format">
                    <input
                        type="checkbox"
                        name="content_format"
                        id="content_format"
                        value="markdown"
                    >
                    <span class="public-toggle-slider"></span>
                    <span class="public-toggle-text">
                        <strong>Use Markdown formatting</strong>
                        <small>**bold** → <strong>bold</strong> · _italic_ → <em>italic</em> · <code>- item</code> → bullet · # Heading → heading</small>
                    </span>
                </label>
            </div>

            <div class="create-post-field">
                <label for="post-content">What would you like to share?</label>
                <textarea
                    id="post-content"
                    name="content"
                    class="form-control create-post-textarea"
                    rows="12"
                    placeholder="Share your recipe, idea, question, or food thought..."
                ></textarea>
            </div>

            <div class="create-post-helper">
                <span>💡</span>
                <p>Tip: Give people enough detail to jump into the conversation.</p>
            </div>

            <div class="create-post-field">
                <label for="media_url">Image or video link (optional)</label>
                <input
                    id="media_url"
                    type="text"
                    name="media_url"
                    class="form-control"
                    placeholder="Got receipts? Paste your pic or clip here"
                >
            </div>

            <div class="create-post-actions">
                <a
                    href="/subforum?sub={{ subforum.id }}"
                    class="create-post-cancel"
                >
                    Cancel
                </a>

                <input
                    type="submit"
                    value="Post Discussion"
                    class="btn dishcourse-primary-btn"
                >
            </div>

        </form>

    </section>

</section>

{% endblock %}
