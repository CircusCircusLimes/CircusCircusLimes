{% extends 'layout.html' %}

{% block body %}
<div class="auth-page">
	<div class="auth-header text-center">
		<p class="section-eyebrow">Account</p>
		<h1>Settings</h1>
		<p>Update your profile details or change your password.</p>
	</div>

	<div class="row g-4 justify-content-center">
		<div class="col-12 col-lg-5">
			<section class="auth-card h-100">
				<div class="auth-card-icon">🧑‍🍳</div>
				<h2>Profile</h2>
				<p class="auth-card-intro">Change your username or email address.</p>

				<form action="/action_update_profile" method="POST">
					<div class="auth-field">
						<label for="settings-username">Username</label>
						<input id="settings-username" type="text" name="username"
							class="form-control" value="{{ current_user.username }}" placeholder="Choose a username">
					</div>

					<div class="auth-field">
						<label for="settings-email">Email</label>
						<input id="settings-email" type="email" name="email"
							class="form-control" value="{{ current_user.email }}" placeholder="Enter your email">
					</div>

					<div class="auth-actions">
						<input type="submit" value="Save Profile" class="btn dishcourse-primary-btn w-100">
					</div>
				</form>
			</section>
		</div>

		<div class="col-12 col-lg-5">
			<section class="auth-card h-100">
				<div class="auth-card-icon">🔒</div>
				<h2>Password</h2>
				<p class="auth-card-intro">Change your account password.</p>

				<form action="/action_change_password" method="POST">
					<div class="auth-field">
						<label for="settings-current-password">Current Password</label>
						<input id="settings-current-password" type="password" name="current_password"
							class="form-control" placeholder="Enter your current password">
					</div>

					<div class="auth-field">
						<label for="settings-new-password">New Password</label>
						<input id="settings-new-password" type="password" name="new_password"
							class="form-control" placeholder="Enter a new password">
					</div>

					<div class="auth-field">
						<label for="settings-confirm-password">Confirm New Password</label>
						<input id="settings-confirm-password" type="password" name="confirm_password"
							class="form-control" placeholder="Re-enter the new password">
					</div>

					<div class="auth-actions">
						<input type="submit" value="Change Password" class="btn dishcourse-primary-btn w-100">
					</div>
				</form>
			</section>
		</div>
	</div>
</div>
{% endblock %}
