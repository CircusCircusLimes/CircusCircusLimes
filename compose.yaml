services:
  web:
    build: .
    container_name: dishcourse-web

    ports:
      - "${APP_PORT}:5000"

    environment:
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: dishcourse-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "127.0.0.1:${DB_PORT}:3306"

    volumes:
      - dishcourse_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  dishcourse_mysql_data: